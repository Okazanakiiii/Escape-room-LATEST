<style>

header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.stars label input:checked~span,.stars label.on span{filter:none;opacity:1}
.hidden{display:none!important}
@media(max-width:600px){.timer{font-size:26px}.stg{font-size:10px}.stg b{font-size:17px}.board td{font-size:15px}.fa{flex-direction:column;align-items:flex-start}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="ov"></div>
<div id="bn"></div>
<div class="modal hidden" id="modal"><div class="card" id="modalBox"></div></div>

<script>
const COLORS=["#e05a4f","#e0b84f","#5fc27a","#4fa3e0","#b07be0","#e07bb8","#4fd0c4","#e0904f"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").trim().toLowerCase().replace(/\s+/g," ");
const fmt=sec=>{sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");};
const color=i=>COLORS[i%COLORS.length];
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==="object"?Object.keys(x).sort((a,b)=>(+a)-(+b)).map(k=>x[k]):[]);
const vals=x=>x&&typeof x==="object"?Object.keys(x).sort().map(k=>x[k]):[];
const SKEY="cpsp_session";
const NS=4; // bilangan bilik

let D={}, ROOT=null, offset=0, connected=false;
let session=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}})();
let tab="dash", lastSig="", seen={clues:-1,rev:"",wakil:0,final:false};

if(FIREBASE_CONFIG.apiKey.includes("PASTE")){
  document.getElementById("app").innerHTML=`<div class="card login"><h2>⚙️ Belum setup Firebase</h2></div>`;
  throw new Error("Firebase not configured");
}
firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database();
ROOT=db.ref("cpsp");

/* ---------- Data helpers ---------- */
const now=()=>Date.now()+offset;
const cfg=()=>D.config||DEFAULT_CONFIG;
const stages=()=>arr(cfg().stages);
const cases=()=>arr(cfg().cases);
const game=()=>D.game||{state:"waiting"};
const teams=()=>arr(D.teams);
const letterOf=i=>{const w=String(cfg().finalWord||"").toUpperCase(); return w?w[i%w.length]:"?";};
function gameElapsed(){
  const g=game(); if(!g.startAt||g.state==="waiting") return 0;
  const ref=g.state==="paused"?g.pausedAt:g.state==="ended"?g.endedAt:now();
  return Math.max(0,(ref-g.startAt-(g.pausedTotal||0))/1000);
}
function pendWait(t){
  if(!t.pendingAt) return 0; const g=game();
  const ref=g.state==="paused"?g.pausedAt:g.state==="ended"?g.endedAt:now();
  return Math.max(0,(ref-t.pendingAt-((g.pausedTotal||0)-(t.pendingPT||0)))/1000);
}
function teamTime(t){ return t.finishSec!=null?t.finishSec:gameElapsed()+(t.penalty||0)-(t.bonus||0)-(t.waitSec||0)-pendWait(t); }
function remaining(t){ return cfg().timeLimitMin*60-teamTime(t); }
function starsOf(t){ const s=t.stars||{}; return [0,1,2,3].map(k=>+s["s"+k]||0); }
function points(t){
  const st=starsOf(t).reduce((a,b)=>a+b,0);
  const timeB=t.status==="escaped"?Math.floor(Math.max(0,cfg().timeLimitMin*60-t.finishSec)/60)*2:0;
  return st*10+(t.stage||0)*20+(t.bonusPts||0)+(t.status==="escaped"?30:0)+timeB;
}
function profileOf(t){
  const s=starsOf(t); const mx=Math.max(...s); if(!mx) return null;
  const k=s.indexOf(mx); const S=stages()[k]; return S?S.icon+" "+S.profile:null;
}
function makeTeams(){
  const C=cases();
  return GROUPS.map((g,i)=>({name:g.name,caseIdx:i%Math.max(1,C.length),code:Array.from({length:NS},()=>Math.floor(Math.random()*10)),
    stage:0,status:"playing",penalty:0,bonus:0,bonusPts:0,clueReq:false}));
}
function upd(i,obj){ return ROOT.child("teams/"+i).update(obj); }
function rank(){
  return teams().map((t,i)=>({t,i})).sort((a,b)=>points(b.t)-points(a.t)||teamTime(a.t)-teamTime(b.t));
}
function badge(t){
  const g=game().state;
  if(t.status==="escaped") return '<span class="tag win">BERJAYA KELUAR</span>';
  if(t.status==="timeout") return '<span class="tag bad">Masa tamat</span>';
  if(g==="waiting") return '<span class="tag">Menunggu</span>';
  if(g==="paused") return '<span class="tag">Dijeda</span>';
  if(g==="ended") return '<span class="tag bad">Tamat</span>';
  return '<span class="tag go">Sedang main</span>';
}
function stageChips(t,i){
  return `<div class="stages">${stages().map((S,k)=>{
    const done=k<t.stage, cur=k===t.stage&&t.status==="playing";
    return `<div class="stg ${done?'done':''} ${cur?'cur':''}"><b>${done?arr(t.code)[k]:S.icon}</b>${esc(S.profile)}</div>`;}).join("")}</div>`;
}

/* ---------- Render control (preserve typed input) ---------- */
function sig(){
  if(!session) return "login";
  if(session.role==="board") return "board|"+JSON.stringify([D.game,D.teams,D.config&&D.config.finalWord]);
  if(session.role==="admin") return "admin|"+tab+"|"+(tab==="cfg"?"":JSON.stringify([D.game,D.teams,D.config]));
  return "team|"+JSON.stringify([D.game,(D.teams||{})[session.g],D.config]);
}
function snap(){
  const m={}; document.querySelectorAll("[data-keep]").forEach(e=>{m[e.dataset.keep]=(e.type==="radio"||e.type==="checkbox")?e.checked:e.value;});
  const a=document.activeElement; return {m,act:a&&a.dataset?a.dataset.keep:null,s:a&&a.selectionStart,e:a&&a.selectionEnd,y:window.scrollY};
}
function restore(S){
  document.querySelectorAll("[data-keep]").forEach(e=>{const v=S.m[e.dataset.keep]; if(v===undefined) return; if(e.type==="radio"||e.type==="checkbox") e.checked=v; else e.value=v;});
  if(S.act){const e=document.querySelector(`[data-keep="${CSS.escape(S.act)}"]`); if(e){e.focus(); try{e.setSelectionRange(S.s,S.e);}catch(x){}}}
  window.scrollTo(0,S.y);
}
function maybeRender(force){ const s=sig(); if(force||s!==lastSig){ lastSig=s; const S=snap(); render(); if(!force) restore(S); notify(); } }
function render(){
  if(!session) return login();
  if(session.role==="admin") return admin();
  if(session.role==="board") return board();
  return team();
}
function setSession(s){ session=s; try{ s?localStorage.setItem(SKEY,JSON.stringify(s)):localStorage.removeItem(SKEY);}catch(e){} maybeRender(true); }
function logout(){ setSession(null); }

/* ---------- Sound ---------- */
let AC=null;
function beep(f=880,d=.15,n=1){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  for(let k=0;k<n;k++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  const t0=AC.currentTime+k*(d+.08);g.gain.setValueAtTime(.18,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d);} }catch(e){} }
function notify(){
  if(!session||session.role!=="team") return;
  const t=teams()[session.g]; if(!t) return;
  const nc=vals(t.clues).length;
  if(seen.clues>=0&&nc>seen.clues) beep(1046,.12,3);
  seen.clues=nc;
  const r=JSON.stringify(t.review||{}); if(seen.rev&&r!==seen.rev) beep(660,.2,2); seen.rev=r;
  const w=(game().wakil||{}).at||0; if(seen.wakil&&w>seen.wakil) beep(520,.3,3); seen.wakil=w;
}

/* ---------- Form fields ---------- */
function draftKey(s){ return `cpsp_draft_${session.g}_${s}`; }
function getDraft(s){ try{return JSON.parse(localStorage.getItem(draftKey(s)))||{};}catch(e){return {};} }
function saveDraft(s){ try{ localStorage.setItem(draftKey(s),JSON.stringify(snap().m)); }catch(e){} }
function fieldsHTML(s,C,prev){
  const S=stages()[s], dr=getDraft(s); prev=prev||{};
  const val=(k,fb)=>esc(dr[k]!==undefined?dr[k]:(fb??""));
  return arr(S.fields).map(F=>{
    const id=`s${s}_${F.id}`;
    if(F.type==="list"){
      const pv=arr(prev[F.id]);
      return `<label class="f">${esc(F.label)} <span class="small">(min ${F.min})</span></label>`+
        Array.from({length:F.n},(_,k)=>`<div class="li"><span>${k+1}.</span><input type="text" data-keep="${id}_${k}" value="${val(id+"_"+k,pv[k])}"></div>`).join("");
    }
    if(F.type==="factcheck"){
      const pv=prev[F.id]||{};
      return `<label class="f">${esc(F.label)}</label>`+arr(C.statements).map((st,k)=>{
        const nm=`${id}_${k}`, chk=v=>dr[nm+"_"+v]!==undefined?(dr[nm+"_"+v]?"checked":""):(pv[k]===v?"checked":"");
        return `<div class="fa"><div>${esc(st.s)}</div><div class="opts seg">
          <label><input type="radio" name="${nm}" value="F" data-keep="${nm}_F" ${chk("F")}><span>Fakta</span></label>
          <label><input type="radio" name="${nm}" value="A" data-keep="${nm}_A" ${chk("A")}><span>Andaian</span></label></div></div>`;}).join("");
    }
    if(F.type==="pick"){
      const src=arr(S.fields).find(x=>x.id===F.from), nm=id;
      return `<label class="f">${esc(F.label)}</label><div class="pick seg">`+Array.from({length:src.n},(_,k)=>{
        const c=dr[nm+"_"+k]!==undefined?(dr[nm+"_"+k]?"checked":""):(+prev[F.id]===k?"checked":"");
        return `<label><input type="radio" name="${nm}" value="${k}" data-keep="${nm}_${k}" ${c}><span>Idea ${k+1}</span></label>`;}).join("")+`</div>`;
    }
    if(F.type==="textarea") return `<label class="f">${esc(F.label)}</label><textarea data-keep="${id}">${val(id,prev[F.id])}</textarea>`;
    return `<label class="f">${esc(F.label)}</label>${F.prefix?`<div class="small" style="margin-bottom:6px">${esc(F.prefix)}</div>`:""}<input type="text" data-keep="${id}" value="${val(id,prev[F.id])}">`;
  }).join("");
}
function collect(s,C){
  const S=stages()[s], out={}; const g=k=>{const e=document.querySelector(`[data-keep="${CSS.escape(k)}"]`);return e?e.value.trim():"";};
  for(const F of arr(S.fields)){
    const id=`s${s}_${F.id}`;
    if(F.type==="list"){ const L=Array.from({length:F.n},(_,k)=>g(id+"_"+k)).filter(Boolean); if(L.length<F.min) return {err:`"${F.label}": isi sekurang-kurangnya ${F.min}.`}; out[F.id]=L; }
    else if(F.type==="factcheck"){ const r=[]; for(let k=0;k<arr(C.statements).length;k++){ const e=document.querySelector(`input[name="${id}_${k}"]:checked`); if(!e) return {err:"Tandakan semua kenyataan sebagai Fakta atau Andaian."}; r.push(e.value);} out[F.id]=r; }
    else if(F.type==="pick"){ const e=document.querySelector(`input[name="${id}"]:checked`); if(!e) return {err:`Pilih ${F.label.toLowerCase()}.`};
      const src=arr(S.fields).find(x=>x.id===F.from); const txt=g(`s${s}_${src.id}_${e.value}`); if(!txt) return {err:"Idea yang dipilih masih kosong."}; out[F.id]=+e.value; out[F.id+"Text"]=txt; }
    else { const v=g(id); if(v.length<3) return {err:`"${F.label}" masih kosong.`}; out[F.id]=v; }
  }
  return {out};
}
function answersHTML(s,ans,C){
  const S=stages()[s]; if(!ans) return "";
  return `<div class="ans">`+arr(S.fields).map(F=>{
    const v=ans[F.id];
    if(F.type==="list") return `<b>${esc(F.label)}</b><ol>${arr(v).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
    if(F.type==="factcheck"){ let ok=0; const st=arr(C.statements);
      const rows=st.map((x,k)=>{const a=arr(v)[k], r=a===x.t; if(r) ok++; return `<li>${esc(x.s)} → <b>${a==="F"?"Fakta":"Andaian"}</b> ${r?"✅":"❌"}</li>`;}).join("");
      return `<b>${esc(F.label)}</b> <span class="tag ${ok===st.length?'win':'go'}">${ok}/${st.length} betul</span><ol>${rows}</ol>`; }
    if(F.type==="pick") return `<b>${esc(F.label)}:</b> Idea ${(+v)+1}: <i>${esc(ans[F.id+"Text"])}</i><br><br>`;
    return `<b>${esc(F.label)}</b><br>${F.prefix?esc(F.prefix)+" ":""}${esc(v)}<br><br>`;
  }).join("")+`</div>`;
}

function myTeam(){ return teams()[session.g]; }
function canPlay(){ const t=myTeam(),g=game(); return t&&t.status==="playing"&&g.state==="running"&&now()>=g.startAt; }
function shake(sel){ const q=$(sel); if(q){q.classList.remove("shake");void q.offsetWidth;q.classList.add("shake");} }
function setMsg(cls,txt){ const m=$("#msg"); if(m){m.className="msg "+cls; m.textContent=txt;} }
function submitStage(){
  if(!canPlay()) return setMsg("bad","Permainan belum bermula atau sedang dijeda.");
  const t=myTeam(), s=t.stage, C=cases()[t.caseIdx];
  const r=collect(s,C); if(r.err){ setMsg("bad","⚠️ "+r.err); shake("#qcard"); return; }
  upd(session.g,{["sub/s"+s]:r.out,["review/s"+s]:{state:"pending",at:now()},pendingAt:now(),pendingPT:game().pausedTotal||0}).then(()=>beep(880,.08));
}
function askClue(){ if(!canPlay()) return; upd(session.g,{clueReq:true}); }
function tryCode(){
  if(!canPlay()) return; const t=myTeam();
  const v=[...document.querySelectorAll("#dial input")].map(e=>e.value).join("");
  if(v===arr(t.code).join("")){ upd(session.g,{status:"escaped",finishSec:Math.round(teamTime(t))}); beep(1200,.15,3); }
  else { setMsg("bad","❌ Kod salah! Semak urutan digit bilik."); shake("#dial"); }
}
function tryFinal(){
  const v=norm($("#fw").value);
  if(v===norm(cfg().finalWord)){ ROOT.child("game").update({finalOpen:true}); }
  else { setMsg("bad","❌ Belum tepat. Kumpul huruf dari semua kumpulan!"); shake("#fw"); }
}

function paintStars(i){ const box=$("#st"+i); if(!box) return; const v=+(box.querySelector("input:checked")||{}).value||0;
  box.querySelectorAll("label").forEach((l,k)=>l.classList.toggle("on",k<v)); }
function startAll(){ ROOT.child("game").set({state:"running",startAt:now()+3500,pausedTotal:0}); }
function pauseAll(){ ROOT.child("game").update({state:"paused",pausedAt:now()}); }
function resumeAll(){ const g=game(); ROOT.child("game").update({state:"running",pausedTotal:(g.pausedTotal||0)+(now()-g.pausedAt),pausedAt:null}); }
function endAll(){ ROOT.child("game").update({state:"ended",endedAt:now()}); closeModal(); }
function resetAll(){ ROOT.update({teams:makeTeams(),game:{state:"waiting"}}); closeModal(); }
function resetTeam(i){ ROOT.child("teams/"+i).set(makeTeams()[i]); closeModal(); }
function openFinal(){ ROOT.child("game").update({finalOpen:true}); closeModal(); }
function callWakil(){ const m=($("#wkmsg").value||"").trim()||"Hantar SATU wakil ke depan sekarang!"; ROOT.child("game/wakil").set({msg:m,at:now()}); $("#wkmsg").value=""; }
function addPts(i,n){ const t=teams()[i]; upd(i,{bonusPts:(t.bonusPts||0)+n}); }
function addTime(i,s){ const t=teams()[i]; const o={bonus:(t.bonus||0)+s}; if(t.status==="timeout"&&remaining({...t,bonus:o.bonus,finishSec:null})>0){o.status="playing";o.finishSec=null;} upd(i,o); }
function sendClue(i){
  const t=teams()[i]; const txt=($("#ct"+i).value||"").trim()||$("#cs"+i).value;
  if(!txt) return alertMsg("Pilih atau taip klu dulu.");
  ROOT.child(`teams/${i}/clues`).push({text:txt,at:now(),stage:t.stage});
  const o={clueReq:false}; const pen=+cfg().cluePenaltySec||0; if(pen) o.penalty=(t.penalty||0)+pen;
  upd(i,o); $("#ct"+i).value=""; $("#cs"+i).value="";
}
function approve(i){
  const t=teams()[i], s=t.stage; const st=+(document.querySelector(`input[name="st${i}"]:checked`)||{}).value||3;
  upd(i,{["review/s"+s]:{state:"approved",stars:st,at:now()},["stars/s"+s]:st,stage:s+1,waitSec:(t.waitSec||0)+pendWait(t),pendingAt:null,pendingPT:null});
}
function reject(i){
  const t=teams()[i], s=t.stage; const c=($("#rc"+i).value||"").trim()||"Cuba lagi. Lebih spesifik dan kreatif!";
  upd(i,{["review/s"+s]:{state:"rejected",comment:c,at:now()},waitSec:(t.waitSec||0)+pendWait(t),pendingAt:null,pendingPT:null});
}
function saveCfg(){
  try{
    const c=JSON.parse($("#cfg").value);
    if(!Array.isArray(c.stages)||c.stages.length!==NS) throw `stages mesti ada tepat ${NS} bilik`;
    if(!Array.isArray(c.cases)||!c.cases.length) throw "cases mesti ada sekurang-kurangnya 1 kes";
    c.cases.forEach((k,n)=>{ if(!k.title||!k.story) throw `Kes ${n+1}: perlu title & story`; if(!Array.isArray(k.statements)) throw `Kes ${n+1}: perlu statements`; });
    c.timeLimitMin=+c.timeLimitMin||45; c.cluePenaltySec=+c.cluePenaltySec||0; c.finalWord=String(c.finalWord||"IKATAN").toUpperCase();
    D.config=c;
    ROOT.update({config:c,teams:makeTeams(),game:{state:"waiting"}}).then(()=>setMsg("ok","✅ Disimpan. Semua kumpulan direset."));
  }catch(e){ setMsg("bad","❌ "+(e.message||e)); }
}

/* ---------- Board ---------- */
function boardHTML(){
  const g=game(), w=String(cfg().finalWord||"").toUpperCase();
  return `<div class="card" style="margin-top:14px"><h2 class="ttl" style="font-size:30px">🏆 Papan Kedudukan</h2>
  <table class="board"><tr><th>#</th><th>Kumpulan</th><th>Bilik</th><th>⭐</th><th>Mata</th><th>Masa</th><th>Status</th></tr>
  ${rank().map((r,k)=>`<tr><td>${k+1}</td><td style="color:${color(r.i)};font-weight:800">${esc(r.t.name)}<div class="small">${esc((cases()[r.t.caseIdx]||{}).title)}</div></td><td>${Math.min(r.t.stage,NS)}/${NS}</td><td>${starsOf(r.t).reduce((a,b)=>a+b,0)}</td><td><b>${points(r.t)}</b></td><td class="mono" data-used="${r.i}">${fmt(teamTime(r.t))}</td><td>${badge(r.t)}${profileOf(r.t)?`<div class="small">${esc(profileOf(r.t))}</div>`:""}</td></tr>`).join("")}
  </table>
  <p class="small">Mata = ⭐×10 + bilik lulus×20 + keluar 30 + baki minit×2 + bonus wakil</p></div>
  <div class="card center" style="margin-top:14px"><h3>${g.finalOpen?"🔓 PINTU AKHIR TERBUKA — SEMUA BERJAYA!":"🔐 Pintu Akhir Bersama"}</h3>
   <div class="letters">${teams().map((t,i)=>`<span style="background:${t.status==="escaped"||g.finalOpen?color(i):"#2c271f"};color:${t.status==="escaped"||g.finalOpen?"#1a1408":"var(--dim)"}">${g.finalOpen?esc(w[i%w.length]):(t.status==="escaped"?"✓":"?")}</span>`).join("")}</div></div>`;
}
function board(){
  $("#app").innerHTML=`<header><h1 class="ttl" style="font-size:34px;color:var(--gold)">🔐 ${esc(cfg().title)}</h1><div class="row"><div class="timer" data-gtime>${fmt(gameElapsed())}</div><button class="ghost sm" onclick="logout()">←</button></div></header>${boardHTML()}`;
}

/* ---------- Ticker ---------- */
setInterval(()=>{
  const g=game();
  document.querySelectorAll("[data-time]").forEach(el=>{const t=teams()[+el.dataset.time]; if(!t) return; const r=remaining(t); el.textContent=fmt(r); el.classList.toggle("low",r<120&&t.status==="playing"&&g.state==="running");});
  document.querySelectorAll("[data-used]").forEach(el=>{const t=teams()[+el.dataset.used]; if(t) el.textContent=fmt(teamTime(t));});
  document.querySelectorAll("[data-gtime]").forEach(el=>el.textContent=fmt(gameElapsed()));
  let ov="";
  if(session&&g.state==="running"&&g.startAt&&now()<g.startAt) ov=`<div class="overlay"><div><div class="small">BERSEDIA…</div><div class="n">${Math.ceil((g.startAt-now())/1000)}</div></div></div>`;
  else if(session&&session.role==="team"&&g.state==="paused") ov=`<div class="overlay"><div><p class="big">⏸</p><h2>Permainan dijeda oleh fasilitator</h2></div></div>`;
  else if(session&&session.role!=="admin"&&g.finalOpen&&!seen.final) ov=`<div class="overlay" onclick="seen.final=true"><div><p class="big">🎉🔓🎉</p><h1 class="ttl" style="font-size:60px;color:var(--gold)">PINTU AKHIR TERBUKA!</h1><h2>Kata kunci: ${esc(cfg().finalWord)} · SEMUA BERJAYA BERSAMA</h2><p class="small">(ketik untuk tutup)</p></div></div>`;
  if($("#ov").innerHTML!==ov) $("#ov").innerHTML=ov;
  const wk=g.wakil, bn=(session&&session.role!=="admin"&&wk&&now()-wk.at<60000)?`<div class="banner">📣 ${esc(wk.msg)}</div>`:"";
  if($("#bn").innerHTML!==bn) $("#bn").innerHTML=bn; document.body.classList.toggle("hasbn",!!bn);
  if(session&&g.state==="running"){
    const ids=session.role==="team"?[session.g]:session.role==="admin"?teams().map((_,i)=>i):[];
    ids.forEach(i=>{const t=teams()[i]; if(t&&t.status==="playing"&&remaining(t)<=0) upd(i,{status:"timeout",finishSec:Math.round(teamTime(t))});});
  }
},250);

/* ---------- Modal ---------- */
function ask(text,action){ $("#modalBox").innerHTML=`<p style="margin-top:0">${text}</p><div class="row" style="justify-content:flex-end"><button class="ghost" onclick="closeModal()">Batal</button><button class="pri" onclick="${action}">Ya</button></div>`; $("#modal").classList.remove("hidden"); }
function alertMsg(text){ $("#modalBox").innerHTML=`<p style="margin-top:0">${text}</p><div class="row" style="justify-content:flex-end"><button class="pri" onclick="closeModal()">OK</button></div>`; $("#modal").classList.remove("hidden"); }
function closeModal(){ $("#modal").classList.add("hidden"); }

/* ---------- Start listening ---------- */
db.ref(".info/serverTimeOffset").on("value",s=>{offset=s.val()||0;});
db.ref(".info/connected").on("value",s=>{connected=!!s.val();const d=$("#conn");if(d)d.className="dot"+(connected?" on":"");});
ROOT.on("value",s=>{D=s.val()||{};maybeRender();},e=>{$("#app").innerHTML=`<div class="card login"><h3>❌ Tak dapat sambung ke database</h3><p class="small">${esc(e.message)}</p><p class="small">Semak Rules Realtime Database (".read": true, ".write": true).</p></div>`;});
</script>
</body>
